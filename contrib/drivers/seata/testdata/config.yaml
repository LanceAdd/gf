# Seata 集成测试配置

# 数据库配置
database:
  default:
    host: "127.0.0.1"
    port: "3306"
    user: "root"
    pass: "root"
    name: "seata_test"
    type: "mysql"
    charset: "utf8mb4"
    dryRun: false
    debug: true
    link: ""

# Seata 配置
seata:
  enabled: true
  mode: "AT"  # AT 或 XA
  txServiceGroup: "default_tx_group"
  
  # 注册中心配置（使用 file 模式进行测试）
  registry:
    type: "file"
    file:
      name: "file.conf"
  
  # 配置中心
  config:
    type: "file"
    file:
      name: "file.conf"

# 日志配置
logger:
  level: "debug"
  stdout: true
