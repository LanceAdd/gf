version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: seata_mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: seata_test
      MYSQL_USER: seata
      MYSQL_PASSWORD: seata
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s
      start_period: 40s

  seata:
    image: seataio/seata-server:1.7.1
    container_name: seata_server_test
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_PORT: 8091
      STORE_MODE: db
      SEATA_IP: seata
      SEATA_CONFIG_NAME: file:/seata-server/resources
    volumes:
      - ./seata.yml:/seata-server/resources/seata.yml
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7091/"]
      timeout: 10s
      retries: 5
      interval: 5s
      start_period: 30s

volumes:
  mysql_data: